[package]
name = "tendns"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99.1"
description = "DNS forwarder with encrypted TXT discovery and hexadecimal IPv4 names"
repository = "https://github.com/cfal/tendns"

[dependencies]
anyhow = "*"
async-trait = "*"
aws-lc-rs = "*"
base64 = "*"
clap = { version = "*", features = ["derive"] }
hickory-proto = "*"
hickory-resolver = { version = "*", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"] }
hickory-server = { version = "*", default-features = false }
humantime = "*"
reqwest = { version = "*", default-features = false, features = ["rustls", "http2", "json", "query"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
toml = "*"
url = "*"
zeroize = "*"

[dev-dependencies]
tokio = { version = "*", features = ["test-util", "process"] }
h2 = "*"
http = "*"
bytes = "*"
rcgen = { version = "*", default-features = false, features = ["crypto", "aws_lc_rs"] }
rustls = { version = "*", default-features = false, features = ["std", "aws_lc_rs"] }
tempfile = "*"
tokio-rustls = { version = "*", default-features = false, features = ["aws_lc_rs"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
strip = true
